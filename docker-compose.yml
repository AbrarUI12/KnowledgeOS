# KnowledgeOS local development stack.
#
#   make up        -> core services (postgres, redis, minio, keycloak, mailpit)
#   make up-full   -> core + clamav + worker, dispatcher, beat (Session 16)
#
# Profiles `obs` (Session 43) and `local-models` (Session 53) are added later.
# Values come from `.env` (copy `.env.example`). Everything here is for local development only.

name: knowledgeos

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgeos}
      KOS_OWNER_PASSWORD: ${KOS_OWNER_PASSWORD:-owner_dev_password}
      KOS_APP_PASSWORD: ${KOS_APP_PASSWORD:-app_dev_password}
      KOS_DISPATCHER_PASSWORD: ${KOS_DISPATCHER_PASSWORD:-dispatcher_dev_password}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *restart
    # The official minio/minio image was withdrawn from Docker Hub; pgsty/minio is the
    # maintained community build of the same server (see agent.md D-008).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-kos_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-kos_minio_dev_secret}
      # All three agents' dev web origins (docs/AGENT_WORKFLOW.md §2).
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGINS:-http://localhost:3000,http://localhost:3100,http://localhost:3200}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:latest
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-kos_minio}:${S3_SECRET_ACCESS_KEY:-kos_minio_dev_secret}@minio:9000
      BUCKETS: >-
        ${S3_BUCKET_QUARANTINE:-kos-quarantine}
        ${S3_BUCKET_TRUSTED:-kos-trusted}
        ${S3_BUCKET_ARTIFACTS:-kos-artifacts}
      QUARANTINE: ${S3_BUCKET_QUARANTINE:-kos-quarantine}
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    volumes:
      - ./infra/docker/minio:/init:ro
    restart: "no"

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      # Fixed public hostname so the token issuer is identical for the browser and for
      # containers; backchannel requests (JWKS, token) may use the internal hostname.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Health endpoints live on the management port 9000 inside the container.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    <<: *restart
    image: axllent/mailpit:latest
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  clamav:
    <<: *restart
    profiles: ["full"]
    image: clamav/clamav:stable
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # Background work (S16). Same backend image; in-network hostnames instead of localhost ports.
  worker: &backend-worker
    <<: *restart
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: worker
    environment: &backend-env
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://knowledgeos_app:${KOS_APP_PASSWORD:-app_dev_password}@postgres:5432/knowledgeos
      DATABASE_MIGRATION_URL: postgresql+asyncpg://knowledgeos_owner:${KOS_OWNER_PASSWORD:-owner_dev_password}@postgres:5432/knowledgeos
      DISPATCHER_DATABASE_URL: postgresql+asyncpg://knowledgeos_dispatcher:${KOS_DISPATCHER_PASSWORD:-dispatcher_dev_password}@postgres:5432/knowledgeos
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-kos_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-kos_minio_dev_secret}
      CLAMAV_HOST: clamav
      # `none` when running without the ClamAV container (core profile); staging/prod require a scan.
      MALWARE_SCANNER: ${MALWARE_SCANNER:-clamav}
      # Crash demo/test only (scripts/demo_worker_crash.sh): slow stages, short leases.
      INGESTION_DEBUG_STAGE_DELAY_SECONDS: ${INGESTION_DEBUG_STAGE_DELAY_SECONDS:-0}
      INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-300}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-120}
      RECONCILE_STALE_SECONDS: ${RECONCILE_STALE_SECONDS:-600}
      # Embeddings (T4.2): model files cache in the hf-cache volume, downloaded once.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      HF_HOME: /models/hf
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/models/hf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatcher:
    <<: *backend-worker
    command: ["python", "-m", "app.workers.dispatcher"]

  beat:
    <<: *backend-worker
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]

volumes:
  postgres-data:
  minio-data:
  clamav-data:
  hf-cache:
