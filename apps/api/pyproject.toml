[project]
name = "knowledgeos-api"
version = "0.1.0"
description = "KnowledgeOS backend: multi-tenant, permission-aware RAG platform API and workers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.139.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.111",
    "charset-normalizer>=3.4.0",
    "fastapi>=0.143.0",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "pillow>=12.0.0",
    "pydantic[email]>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.0.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
    "pyjwt[crypto]>=2.15.1",
    "psutil>=7.0.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "lingua-language-detector>=2.2.0",
    "beautifulsoup4>=4.15.0",
    "onnxruntime>=1.31.0",
    "celery[redis]>=5.5",
    "sentence-transformers[onnx]>=5.2,<6",
    "huggingface-hub>=0.34,<1",
    "pyyaml>=6.0.3",
    "tokenizers>=0.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "TID",
]
# N818: API error classes use domain names (NotFound, Forbidden), as in session.md.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "uuid_utils.*", "asyncpg.*", "celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external services",
    "integration: tests that need real Postgres/Redis/object storage",
    "security: security regression tests",
    "slow: slow tests (model loading, large fixtures)",
    "llm: tests that call a real LLM provider",
    "crash: kills a worker on the local Docker stack (KOS_CRASH_TEST=1; scripts/demo_worker_crash.sh)",
    "gate: milestone gate checks over the full demo corpus with real models (KOS_GATE=1; make gate-g4)",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.111",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "syrupy>=6.1.1",
    "testcontainers[minio,postgres,redis]>=4.15.0",
    # Demo corpus generation (T4.5)
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
    "types-psutil>=7.2.2.20260906",
    "types-openpyxl>=3.1.5.20260827",
    "types-reportlab>=5.0.0.20261008",
    "types-pyyaml>=6.0.12.20260906",
]
