name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag is published
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Docling model assets for real parser snapshots
        run: uv run python ../../scripts/download_docling_models.py --output-dir .venv/docling-assets

      - name: Ruff lint
        run: uv run ruff check . ../../scripts

      - name: Ruff format
        run: uv run ruff format --check . ../../scripts

      - name: mypy (strict)
        run: uv run mypy

      # Integration tests start real Postgres (with the Compose init scripts), Redis and MinIO
      # via Testcontainers. This includes the migration upgrade -> downgrade -> upgrade check.
      - name: pytest (unit + integration)
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: Generated API client drift
        run: pnpm check:api

      - name: ESLint
        run: pnpm web:lint

      - name: Prettier
        run: pnpm --filter @knowledgeos/web format:check

      - name: Typecheck
        run: pnpm web:typecheck

      - name: Vitest
        run: pnpm web:test

      - name: Build
        run: pnpm web:build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend (api target)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          target: api
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
