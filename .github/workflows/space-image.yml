# Build and publish the all-in-one staging image (S32/S33, fast-track C3). Manual on purpose:
# deploy-on-push is cut for M1 (DV-008). The HF Space's Dockerfile is `FROM` the pushed tag.
name: Space image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag besides the commit SHA"
        required: false
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The image bakes ~3 GB of model weights; the hosted runner needs the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/knowledgeos-space
          docker build -f infra/docker/backend.Dockerfile --target worker -t knowledgeos-worker:ci .
          docker build -f infra/docker/space.Dockerfile --build-arg BACKEND_IMAGE=knowledgeos-worker:ci \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:${{ inputs.tag }}" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ inputs.tag }}"
          echo "Pushed $IMAGE:${{ github.sha }} and :${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
