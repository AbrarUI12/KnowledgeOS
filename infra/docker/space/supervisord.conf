; All KnowledgeOS backend processes in one container (free HF Space, ADR-008 / DV-001).
; Every program logs to the container's stdout/stderr; supervisord itself stays in the foreground.

[supervisord]
nodaemon=true
user=app
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:clamd]
; Signatures were baked at build time; freshclam below keeps them current while running.
command=clamd --foreground=true --config-file=/etc/clamav/clamd.conf
priority=10
autorestart=true
startsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:freshclam]
command=freshclam --foreground --daemon --checks=4 --stdout
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 7860 --proxy-headers --forwarded-allow-ips "*" --timeout-keep-alive 75
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-ingestion]
; One ingestion job at a time: Docling + embeddings are the memory-heavy part.
command=celery -A app.workers.celery_app worker --loglevel info --concurrency 1 --prefetch-multiplier 1 -Q ingestion -n ingestion@%%h
directory=/app
priority=30
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-default]
command=celery -A app.workers.celery_app worker --loglevel info --concurrency 1 --prefetch-multiplier 1 -Q maintenance,sync,eval,llm -n default@%%h
directory=/app
priority=30
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dispatcher]
command=python -m app.workers.dispatcher
directory=/app
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beat]
command=celery -A app.workers.celery_app beat --loglevel info --schedule /tmp/celerybeat-schedule
directory=/app
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
